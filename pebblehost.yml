## Reverse Proxy Settings
#
# Please configure these options from within your panel under Tools > Reverse Proxy
# Reverse Proxy Domain
proxy-domain=
# Reverse Proxy Port
proxy-port=

## Node.js heap / Pebble Git OOM ("JavaScript heap out of memory" in /opt/start.js updateGit):
# In the bot panel → Environment Variables, add exactly:
#   NODE_OPTIONS = --max-old-space-size=896
# (keep under your plan RAM — e.g. 896 with 1024M server.) That applies to ALL node
# processes (including Git pull), unlike the npm "start" line in package.json.
#
# AFTER force-push / rewritten main (crash STILL happens): Pebble keeps an OLD clone on disk.
# "git pull" merges unrelated histories → huge merge → heap OOM ~598 MB BEFORE npm runs.
# Fix ON THE PANEL (pick one):
#   • Git tools → reinstall / reset repo / wipe workspace (exact wording varies), OR
#   • Turn OFF Git Integration → turn ON again + same repo URL + branch main (fresh clone).
#

## Git Management
#
#Please configure these options from within your panel under Tools > Git Management
# Git URL
git-url=
# Git Branch
git-branch=